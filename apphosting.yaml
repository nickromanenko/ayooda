# Firebase App Hosting — Next.js web app (apps/web) in a pnpm workspace monorepo.
#
# App Hosting's Next.js framework adapter does not support pnpm workspaces
# (firebase/firebase-tools#7478): with the backend root directory set to
# apps/web it fails with "Missing Lock File" because the single pnpm-lock.yaml
# lives at the repo root, and apps/web depends on the internal @ayooda/shared
# workspace package (which must be built first).
#
# Fix: set the backend **root directory to `/`** (repo root) so the whole
# workspace installs from the root lockfile, then override the build/run
# commands here. The override opts out of the framework adapter — we build
# @ayooda/shared then apps/web, and run `next start` ourselves.

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

scripts:
  buildCommand: pnpm --filter @ayooda/shared build && pnpm --filter web build
  runCommand: pnpm --filter web start

# Adapter is bypassed, so keep the full built workspace in the runtime bundle
# (root node_modules, apps/web/.next, packages/shared/dist, manifests).
outputFiles:
  serverApp:
    include:
      - .

env:
  # ── Public (baked into the client bundle at build time) ──────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyABCNGiFnEEXkP8ESPAN8qGhx495TJ_cc4
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ayooda-1791f.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ayooda-1791f
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ayooda-1791f.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "961350499645"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:961350499645:web:b31543aec7bb7dd28b5954
    availability:
      - BUILD
      - RUNTIME

  # ── API URL ──────────────────────────────────────────────────────────────
  - variable: NEXT_PUBLIC_API_URL
    value: https://api.ayooda.live
    availability:
      - BUILD
      - RUNTIME

  # ── Server-only (session cookie verification via Firebase Admin SDK) ─────
  - variable: FIREBASE_PROJECT_ID
    value: ayooda-1791f
    availability:
      - RUNTIME

  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: firebase-service-account-key
    availability:
      - RUNTIME
