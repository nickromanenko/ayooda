# Firebase App Hosting — Next.js (apps/web)
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  runtime: nodejs22
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

env:
  # ── Public (baked into the client bundle at build time) ──────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyABCNGiFnEEXkP8ESPAN8qGhx495TJ_cc4
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ayooda-1791f.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ayooda-1791f
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ayooda-1791f.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "961350499645"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:961350499645:web:b31543aec7bb7dd28b5954
    availability:
      - BUILD
      - RUNTIME

  # ── API URL (served via Firebase Hosting rewrite to Cloud Run) ───────────
  - variable: NEXT_PUBLIC_API_URL
    value: https://api.ayooda.live
    availability:
      - BUILD
      - RUNTIME

  # ── Server-only (session cookie verification via Firebase Admin SDK) ─────
  - variable: FIREBASE_PROJECT_ID
    value: ayooda-1791f
    availability:
      - RUNTIME

  # Store the service account key JSON in Google Secret Manager, then
  # reference it here. Run once to create:
  #   gcloud secrets create firebase-service-account-key \
  #     --data-file=service-account.json
  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: firebase-service-account-key
    availability:
      - RUNTIME
