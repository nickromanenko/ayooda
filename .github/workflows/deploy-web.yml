name: Deploy Web to Cloud Run

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ayooda-1791f
  REGION: us-central1
  SERVICE: ayooda-web
  AR_REPO: ayooda
  DOCKER_BUILDKIT: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # NEXT_PUBLIC_* are public Firebase config, baked into the client bundle at
      # build time. BuildKit uses apps/web/Dockerfile.dockerignore so the context
      # includes apps/web (the repo-root .dockerignore excludes it).
      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/web:${IMAGE_TAG}"
          docker build -f apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=AIzaSyABCNGiFnEEXkP8ESPAN8qGhx495TJ_cc4 \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=ayooda-1791f.firebaseapp.com \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=ayooda-1791f \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=ayooda-1791f.firebasestorage.app \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=961350499645 \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=1:961350499645:web:b31543aec7bb7dd28b5954 \
            --build-arg NEXT_PUBLIC_API_URL=https://api.ayooda.live \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars "FIREBASE_PROJECT_ID=ayooda-1791f" \
            --set-secrets "FIREBASE_SERVICE_ACCOUNT_KEY=firebase-service-account-key:latest" \
            --quiet
